<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Io Page Viewer</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --accent-color: #38bdf8;
            --text-color: #e2e8f0;
            --border-color: #1e293b;
            --danger-color: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.25rem;
            color: var(--accent-color);
            cursor: pointer;
        }

        nav a {
            color: var(--text-color);
            text-decoration: none;
            margin-left: 1rem;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        #content-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 2rem;
            min-height: 400px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .loading, .error {
            text-align: center;
            color: #94a3b8;
            margin-top: 4rem;
        }

        .error {
            color: var(--danger-color);
        }
    </style>
</head>
<body>

    <header>
        <h1 onclick="location.hash='#p=1'">Io System</h1>
        <nav id="nav-links">
            <a href="#p=1">ページ 1</a>
            <a href="#p=2">ページ 2</a>
        </nav>
    </header>

    <main>
        <div id="content-box">
            <div class="loading">読み込み中...</div>
        </div>
    </main>

    <script>
        function loadPage() {
            // ハッシュからページ番号を取得 (例: #p=1 なら 1)
            const hash = window.location.hash.substring(1);
            const params = {};
            hash.split('&').forEach(part => {
                const item = part.split('=');
                if (item.length === 2) params[item[0]] = item[1];
            });

            const pageId = params.p || '1';
            const contentBox = document.getElementById('content-box');

            // 1. まずブラウザのローカルストレージ（管理画面で追加した分）にあるかチェック
            const localSavedHtml = localStorage.getItem('io_custom_page_' + pageId);

            if (localSavedHtml) {
                contentBox.innerHTML = localSavedHtml;
            } else {
                // 2. なければjsDelivr経由でGitHubからファイルをfetch
                const targetUrl = `https://cdn.jsdelivr.net/gh/1205iosato1205-del/io1205-@main/pages/${pageId}.html`;
                
                contentBox.innerHTML = `<div class="loading">ページ ${pageId} を読み込み中...</div>`;

                fetch(targetUrl)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`ページが見つからなかったよ (Error: ${response.status})`);
                        }
                        return response.text();
                    })
                    .then(html => {
                        contentBox.innerHTML = html;
                    })
                    .catch(error => {
                        contentBox.innerHTML = `
                            <div class="error">
                                <h2>読み込みエラー</h2>
                                <p>${error.message}</p>
                                <p style="margin-top: 1rem; font-size: 0.85rem; color: #64748b;">
                                    指定したページファイルが存在しません。<br>
                                    <code style="color: var(--accent-color);">${targetUrl}</code>
                                </p>
                            </div>
                        `;
                    });
            }
        }

        // 初回ロード時と、ハッシュが変わった時にページを読み込む
        window.addEventListener('DOMContentLoaded', loadPage);
        window.addEventListener('hashchange', loadPage);
    </script>
</body>
</html>
